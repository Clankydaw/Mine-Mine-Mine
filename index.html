<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moving Love Heart</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="heart-container"></div>

<script>
const container = document.getElementById("heart-container");

const total = 90;
const words = [];

for(let i = 0; i < total; i++){
    const div = document.createElement("div");
    div.className = "love";
    div.innerText = "NINA";
    container.appendChild(div);
    words.push(div);
}

function animate(time){
    const w = window.innerWidth;
    const h = window.innerHeight;

    const centerX = w / 2;
    const centerY = h / 2;

    const size = Math.min(w, h) / 50;

    words.forEach((word, i) => {
        let t = (i / total) * Math.PI * 2;
        t += time * 0.00025;

        let x = 16 * Math.pow(Math.sin(t), 3);

        let y =
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

        x *= size;
        y *= size;

        let finalX = centerX + x;
        let finalY = centerY - y;

        word.style.left = finalX + "px";
        word.style.top = finalY + "px";

        const fade = (finalY - centerY + 220) / 430;
        word.style.opacity = Math.max(0.05, 1 - fade);

        const scale = Math.max(0.3, 1 - fade * 0.7);

        word.style.transform =
            `translate(-50%, -50%) scale(${scale})`;
    });

    requestAnimationFrame(animate);
}

animate(0);
</script>

</body>
</html>
